name: wear_bridge
description: Sends messages to the paired Wear OS watch. A plugin (not a
  channel in MainActivity) so background isolates such as workmanager's get
  it registered too.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: fyi.procrastinator.wear_bridge
        pluginClass: WearBridgePlugin
